[project]
name = "qualm-desktop"
version = "0.1.0b2"
description = "Qualm: intent-aware screen intervention on macOS (after SeeNot), decided by a Jev-style typed decision model (local Kev or hosted Jev)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Tianrun Qiu", email = "scrisqiu@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "pyobjc-framework-vision>=12.2.2",
    "typesafe-sdk>=0.7.1",
]

[project.scripts]
qualm = "qualm:main"

[tool.uv.build-backend]
# "qualm" on PyPI is an unrelated esolang; the import package and the command are still `qualm`.
module-name = "qualm"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
