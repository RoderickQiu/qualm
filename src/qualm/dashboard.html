<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Qualm review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffb36b'/%3E%3Cstop offset='1' stop-color='%23f0645a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='31' cy='30' r='14' fill='none' stroke='white' stroke-width='6'/%3E%3Cpath d='M40 39 L49 48' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* The page is titled "Qualm review" on purpose: the watcher never judges a window with that title. */
:root {
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1e; --mute:#6e6e73; --faint:#a1a1a6; --line:#e6e4df; --soft:#f0eee9;
  --accent:#f3814e; --accent2:#ffb36b; --accentbg:#fdeee4;
  --back:#3fae6a; --snooze:#e9a23b; --fine:#6f86b8; --never:#a07cc5; --open:#cfccc6;
  --focus:#2f9fd8; --focusbg:#e3f3fb;
  --red:#c8372d; --redbg:#fbeae8; --amber:#9a5700; --amberbg:#fcf0dc; --blue:#1f5fbf; --bluebg:#e7effb; --green:#1e7b3c; --greenbg:#e4f3e9;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 24px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#131314; --card:#1d1d1f; --ink:#f2f2f4; --mute:#a0a0a8; --faint:#6b6b72; --line:#2d2d31; --soft:#26262a;
    --accentbg:#3a2419; --open:#48474d; --focusbg:#15303e;
    --red:#ff7a6e; --redbg:#3b1d1a; --amber:#f2b454; --amberbg:#3a2c14; --blue:#79a8ff; --bluebg:#18264a; --green:#6fd48e; --greenbg:#16301f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 30px rgba(0,0,0,.25);
  }
}
* { box-sizing:border-box; }
body { margin:0; font:15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
nav { display:flex; align-items:center; gap:6px; padding:12px 24px; position:sticky; top:0; z-index:5;
  background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:saturate(1.6) blur(18px); -webkit-backdrop-filter:saturate(1.6) blur(18px); border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:10px; margin-right:18px; font-weight:700; font-size:17px; letter-spacing:-.01em; }
.brand svg { width:28px; height:28px; }
.tabs { display:flex; gap:2px; background:var(--soft); padding:3px; border-radius:11px; }
.tabs a { padding:6px 14px; border-radius:8px; color:var(--mute); text-decoration:none; cursor:pointer; font-size:14px; font-weight:500; user-select:none; }
.tabs a.on { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
.tabs a .n { display:inline-block; min-width:18px; padding:0 5px; margin-left:4px; border-radius:9px; background:var(--accent); color:#fff; font-size:11px; font-weight:700; text-align:center; }
nav .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
.chip { display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:20px; font-size:13px; font-weight:500; background:var(--soft); color:var(--mute); }
.chip .dot { width:7px; height:7px; border-radius:50%; background:var(--back); }
.chip.focus { background:var(--focusbg); color:var(--focus); } .chip.focus .dot { background:var(--focus); }
.chip.paused { background:var(--amberbg); color:var(--amber); } .chip.paused .dot { background:var(--snooze); }
.wrap { max-width:1180px; margin:0 auto; padding:26px 24px 60px; }
.muted { color:var(--mute); } .faint { color:var(--faint); } .small { font-size:13px; }
kbd { font:12px ui-monospace, SFMono-Regular, monospace; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; background:var(--card); color:var(--mute); }
button { font:inherit; font-size:14px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:9px; padding:8px 14px; cursor:pointer; transition:border-color .15s, background .15s; }
button:hover { border-color:var(--faint); }
button.primary { background:var(--ink); color:var(--card); border-color:var(--ink); }
button.accent { background:linear-gradient(135deg, var(--accent2), var(--accent)); color:#fff; border:0; font-weight:600; }
button.focusbtn { background:var(--focus); color:#fff; border:0; font-weight:600; }
input[type=text], input[type=search], textarea, select { font:inherit; font-size:14px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:9px; padding:8px 10px; }
input:focus, textarea:focus, select:focus { outline:2px solid color-mix(in srgb, var(--focus) 45%, transparent); border-color:var(--focus); }
h1 { font-size:30px; letter-spacing:-.02em; margin:0 0 4px; font-weight:700; }
h2 { font-size:16px; margin:0 0 12px; font-weight:650; letter-spacing:-.005em; }
.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; box-shadow:var(--shadow); }
.grid { display:grid; gap:16px; }
.g2 { grid-template-columns:repeat(2, minmax(0,1fr)); } .g4 { grid-template-columns:repeat(4, minmax(0,1fr)); } .g3 { grid-template-columns:repeat(3, minmax(0,1fr)); }
@media (max-width:900px) { .g2, .g3, .g4 { grid-template-columns:1fr 1fr; } }
.stat .v { font-size:34px; font-weight:700; letter-spacing:-.02em; line-height:1.1; font-variant-numeric:tabular-nums; }
.stat .k { font-size:13px; color:var(--mute); margin-top:4px; }
.stat .sub { font-size:12px; color:var(--faint); margin-top:2px; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--mute); margin-top:10px; }
.legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
svg text { fill:var(--mute); font-size:11px; font-family:inherit; }
.bar { height:10px; border-radius:6px; background:var(--soft); overflow:hidden; }
.bar > div { height:100%; border-radius:6px; background:linear-gradient(90deg, var(--accent2), var(--accent)); }
.row { display:flex; align-items:center; gap:12px; }
.hero { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:16px; margin-bottom:16px; }
@media (max-width:900px) { .hero { grid-template-columns:1fr; } }
.session h2 { display:flex; align-items:center; gap:8px; }
.session .intent { font-size:22px; font-weight:650; letter-spacing:-.01em; margin:2px 0 6px; }
.session form { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.session form input { flex:1; min-width:180px; }
.seg { display:inline-flex; background:var(--soft); border-radius:9px; padding:2px; }
.seg button { border:0; background:transparent; padding:6px 10px; border-radius:7px; color:var(--mute); }
.seg button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12); }
.empty { text-align:center; padding:46px 20px; color:var(--mute); }
.empty .big { font-size:40px; margin-bottom:6px; }
.list-plain > div { padding:9px 0; border-top:1px solid var(--line); } .list-plain > div:first-child { border-top:0; }
.quote { font-size:15px; } .quote::before { content:"“"; color:var(--faint); } .quote::after { content:"”"; color:var(--faint); }

/* review: one screen at a time */
.progress { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.progress .track { flex:1; height:6px; background:var(--soft); border-radius:3px; overflow:hidden; }
.progress .fill { height:100%; background:var(--back); }
.one { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:24px; }
.one img { width:100%; border-radius:12px; border:1px solid var(--line); display:block; cursor:zoom-in; }
.noshot { aspect-ratio:16/10; border-radius:12px; background:var(--soft); display:flex; align-items:center; justify-content:center; color:var(--mute); }
.title { font-size:19px; font-weight:650; overflow-wrap:anywhere; letter-spacing:-.01em; }
.url { color:var(--mute); font-size:13px; overflow-wrap:anywhere; margin-top:2px; }
.said { margin:16px 0; padding:12px 14px; border-radius:12px; font-size:15px; }
.said.intervene { background:var(--accentbg); color:var(--accent); }
.said.allow { background:var(--amberbg); color:var(--amber); }
.said.count { background:var(--bluebg); color:var(--blue); }
.said.none { background:var(--soft); color:var(--mute); }
.said .why { display:block; font-size:13px; opacity:.85; margin-top:3px; }
.q { font-weight:650; margin:18px 0 8px; }
.choices { display:flex; gap:8px; flex-wrap:wrap; }
.choices button { font-size:15px; padding:10px 16px; }
.choices .right.sel { background:var(--greenbg); border-color:var(--green); color:var(--green); }
.choices .wrong.sel { background:var(--redbg); border-color:var(--red); color:var(--red); }
.chips { display:flex; flex-direction:column; gap:6px; margin-top:6px; }
.pick { display:flex; align-items:center; gap:10px; text-align:left; padding:8px 12px; border-radius:10px; }
.pick.sel { background:var(--redbg); border-color:var(--red); }
.pick.none.sel { background:var(--greenbg); border-color:var(--green); }
.pick .name { font-weight:600; } .pick .desc { font-size:12px; color:var(--mute); }
.pick kbd { flex:none; }
.save { margin-top:12px; display:flex; gap:8px; align-items:center; }
details { margin-top:18px; } summary { cursor:pointer; color:var(--mute); font-size:13px; }
.scores { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
.scores td { padding:3px 4px; }
.meter { position:relative; height:7px; background:var(--soft); border-radius:4px; width:130px; }
.meter .f { position:absolute; left:0; top:0; bottom:0; border-radius:4px; background:var(--faint); }
.meter .f.over { background:var(--accent); }
.meter .t { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); }
pre { background:var(--soft); border-radius:8px; padding:8px; white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; max-height:220px; overflow:auto; }
.keys { margin-top:14px; font-size:12px; color:var(--mute); }
.similar { margin:-6px 0 6px; } .similar summary { color:var(--ink); font-size:14px; }

/* all screens */
.opts { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
.opts input[type=search] { min-width:260px; }
.opts button.on { background:var(--ink); color:var(--card); border-color:var(--ink); }
table.list { width:100%; border-collapse:collapse; font-size:14px; }
table.list td { padding:8px 10px; border-top:1px solid var(--line); vertical-align:middle; }
table.list tr { cursor:pointer; } table.list tr:hover td { background:var(--soft); }
table.list img { width:68px; height:42px; object-fit:cover; border-radius:6px; display:block; }
table.list .t { max-width:480px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tag { display:inline-block; border-radius:6px; padding:1px 8px; font-size:12px; font-weight:600; white-space:nowrap; }
.tag.intervene { background:var(--accentbg); color:var(--accent); } .tag.allow { background:var(--amberbg); color:var(--amber); }
.tag.count { background:var(--bluebg); color:var(--blue); } .tag.none, .tag.skip { background:var(--soft); color:var(--mute); }
.tag.right { background:var(--greenbg); color:var(--green); } .tag.wrong { background:var(--redbg); color:var(--red); }

/* rules */
.rule { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:14px; align-items:start; padding:14px 0; border-top:1px solid var(--line); }
.rule:first-of-type { border-top:0; }
.rule .id { font-weight:650; } .rule .sum { color:var(--mute); font-size:14px; margin-top:2px; }
.rule.off .id, .rule.off .sum { opacity:.5; }
.switch { position:relative; width:42px; height:25px; border-radius:13px; background:var(--open); border:0; padding:0; cursor:pointer; transition:background .2s; flex:none; margin-top:2px; }
.switch::after { content:""; position:absolute; top:3px; left:3px; width:19px; height:19px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .2s; }
.switch.on { background:var(--back); } .switch.on::after { left:20px; }
table.tune { width:100%; border-collapse:collapse; font-size:14px; }
table.tune td, table.tune th { padding:8px; border-top:1px solid var(--line); text-align:left; vertical-align:top; }
table.tune th { font-size:12px; color:var(--mute); font-weight:500; border-top:0; }
#zoom { position:fixed; inset:0; background:rgba(0,0,0,.82); display:none; align-items:center; justify-content:center; z-index:10; cursor:zoom-out; }
#zoom img { max-width:94vw; max-height:94vh; border-radius:10px; }
.toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--card); padding:9px 16px; border-radius:10px; font-size:13px; display:none; z-index:20; box-shadow:var(--shadow); }
.heat td { width:calc(100% / 25); height:18px; border-radius:3px; }
.heat { border-collapse:separate; border-spacing:2px; width:100%; table-layout:fixed; }
.heat th { font-size:10px; color:var(--faint); font-weight:500; }
</style></head><body>
<nav>
  <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb36b"/><stop offset="1" stop-color="#f0645a"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><circle cx="31" cy="30" r="14" fill="none" stroke="white" stroke-width="6"/><path d="M40 39 L49 48" stroke="white" stroke-width="6" stroke-linecap="round"/></svg>Qualm</div>
  <div class="tabs">
    <a data-tab="today">Today</a>
    <a data-tab="review">Review<span id="nleft"></span></a>
    <a data-tab="all">All screens</a>
    <a data-tab="insights">Insights</a>
    <a data-tab="rules">Rules</a>
  </div>
  <div class="right"><span id="mode" class="small faint"></span><span id="state"></span></div>
</nav>
<div class="wrap" id="view"></div>
<div id="zoom"><img alt=""></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
let D = null;
let tab = location.hash.slice(1) || "today", pos = 0, quiet = false, search = "", listFilter = "all";
let pick = null;      // while answering "wrong": the set of rule ids the page really is
let showDetails = false, focusLen = 50;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const OUT = {back:["Went back","var(--back)"], snooze:["Unlocked","var(--snooze)"], fine:["Not this one","var(--fine)"], never:["Never here","var(--never)"], open:["No answer","var(--open)"]};
function toast(t) { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(el.tm); el.tm = setTimeout(() => { el.style.display = "none"; }, 1800); }

async function load() {
  const r = await (await fetch("/api/data")).json();
  if (r.error) { $("#view").innerHTML = '<div class="card empty"><div class="big">!</div><h2>Can\'t read your setup</h2><div class="muted">' + esc(r.error) + "</div></div>"; return; }
  D = r; render();
}
async function post(path, body) {
  const r = await (await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)})).json();
  if (r.error) { toast(r.error); return false; }
  D = r; return true;
}

// ---- model of the data -------------------------------------------------
function ruleName(r) {
  const t = r.text || "";
  const cut = t.split(/,? such as |[,:;，：；(（]/)[0];
  return cut.length > 60 ? cut.slice(0, 57) + "…" : cut;
}
function outcome(j) {
  // Decisions for a rule you've since removed don't count.
  const ids = new Set(D.rules.map(r => r.id));
  const a = j.decisions.filter(d => !d.rule || ids.has(d.rule)).map(d => d.action);
  for (const k of ["intervene", "allow", "count", "skip"]) if (a.includes(k)) return k;
  return "none";
}
function nearMiss(j) {
  if (!j.p_hit) return 0;
  let m = 0;
  for (const rid in j.p_hit) { const t = (j.thresholds || {})[rid] || 0.5; m = Math.max(m, j.p_hit[rid] / t); }
  return m;
}
// One entry per page (URL, or app + title): the latest detailed judgement of it.
function screens() {
  const by = new Map();
  for (const j of D.judgements) {
    if ((j.screen.window_title === "Qualm" || j.screen.window_title === "SeeNot") && !j.screen.url) continue;  // our own panel
    const key = j.screen.url || (j.screen.app + "|" + (j.screen.window_title || ""));
    const e = by.get(key) || {key, items:[]};
    e.items.push(j); by.set(key, e);
  }
  const out = [];
  for (const e of by.values()) {
    const detailed = e.items.filter(j => j.p_hit);
    e.j = detailed.length ? detailed[detailed.length - 1] : e.items[e.items.length - 1];
    e.review = null;
    for (const j of e.items) if (D.reviews[j.id]) e.review = D.reviews[j.id];
    e.first = e.items[0].at; e.last = e.items[e.items.length - 1].at;
    e.shot = e.j.shot || (e.items.slice().reverse().find(j => j.shot) || {}).shot;
    out.push(e);
  }
  return out;
}
// Similar screens: the same site and kind of page, with ids blanked out
// (youtube.com/shorts/*, reddit.com/r/*/comments/*), and the same outcome.
function looksLikeId(seg) { return /\d/.test(seg) || seg.length >= 12 || /^[A-Za-z0-9_-]{8,}$/.test(seg) && /[A-Z]/.test(seg) && /[a-z]/.test(seg); }
function simKey(e) {
  const j = e.j;
  let where = j.screen.app;
  if (j.screen.url && /^https?:/.test(j.screen.url)) {
    try {
      const u = new URL(j.screen.url);
      const segs = u.pathname.split("/").filter(Boolean).slice(0, 4).map(x => looksLikeId(x) ? "*" : x);
      if (segs[0] === "r" && segs.length > 1) segs[1] = "*";
      where = u.hostname.replace(/^www\./, "") + "/" + segs.join("/");
    } catch (err) { where = j.screen.url; }
  }
  const acts = j.decisions.filter(d => d.rule).map(d => d.action + ":" + d.rule).sort().join(",");
  return where + "|" + outcome(j) + "|" + acts;
}
function similarGroups(list) {
  const by = new Map();
  for (const e of list) { const k = simKey(e); if (!by.has(k)) by.set(k, []); by.get(k).push(e); }
  return [...by.values()].map(members => {
    members.sort((a, b) => (b.last < a.last ? -1 : 1));
    return {key: members[0].key, rep: members[0], members: members};
  });
}
const PRIORITY = {intervene:0, allow:1, count:2, none:3, skip:4};
function queue() {
  const open = screens()
    .filter(e => e.j.p_hit && !(e.review && e.review.verdict))
    .filter(e => quiet || outcome(e.j) !== "none" || nearMiss(e.j) >= 0.5);
  // Within each outcome, closest calls first: your answer there moves a
  // threshold the most. URL-pattern hits are certain, so they go last.
  return similarGroups(open)
    .sort((a, b) => (PRIORITY[outcome(a.rep.j)] - PRIORITY[outcome(b.rep.j)]) ||
                    (closeness(a.rep.j) - closeness(b.rep.j)) || (b.members.length - a.members.length) ||
                    (b.rep.last < a.rep.last ? -1 : 1));
}
function closeness(j) {
  if (!j.p_hit) return 99;
  const byPattern = new Set(j.decisions.filter(d => d.reason === "matches URL pattern").map(d => d.rule));
  let best = 99;
  for (const rid in j.p_hit) {
    if (byPattern.has(rid)) continue;
    const t = (j.thresholds || {})[rid] || 0.5;
    best = Math.min(best, Math.abs(Math.log(Math.max(j.p_hit[rid], 1e-3) / t)));
  }
  return best;
}
function said(j) {
  const o = outcome(j);
  const ds = j.decisions.filter(d => d.action === o);
  const rules = ds.map(d => "<b>" + esc(d.rule) + "</b>").join(", ");
  const why = ds.map(d => esc(d.reason)).filter(Boolean).join("; ");
  if (o === "intervene") return {cls:"intervene", text:"Qualm popped up: this looks like " + rules, why:"because " + why + (j.focus ? " · during focus: " + esc(j.focus) : "")};
  if (o === "allow") {
    let w = why;
    if (why.includes("opened on purpose") && j.came_from) w += " (you came from a " + esc(j.came_from.page_kind) + " page)";
    return {cls:"allow", text:"Qualm let it through: it matched " + rules + " but an exemption applied", why:w};
  }
  if (o === "count") return {cls:"count", text:"Qualm counted time toward " + rules, why:why};
  if (o === "skip") return {cls:"none", text:"Not judged", why:why};
  const top = j.p_hit ? Object.entries(j.p_hit).sort((a, b) => b[1] - a[1])[0] : null;
  return {cls:"none", text:"Qualm did nothing", why: top ? "closest rule: " + esc(top[0]) + " at " + top[1].toFixed(2) + " (needs " + esc((j.thresholds || {})[top[0]]) + ")" : ""};
}
function flagged(j) { return new Set(j.decisions.filter(d => d.action === "intervene" || d.action === "count" || d.action === "allow").map(d => d.rule)); }
const hm = iso => iso.slice(11, 16);
const clock = t => new Date(t * 1000).toTimeString().slice(0, 5);

// ---- small SVG charts ----------------------------------------------------
// Stacked bars: cols = [{label, parts:{key:n}}], keys in stacking order.
function stacked(cols, keys, colors, h = 150) {
  const w = 540, pad = 22, bw = (w - pad) / cols.length;
  const max = Math.max(1, ...cols.map(c => keys.reduce((n, k) => n + (c.parts[k] || 0), 0)));
  let s = '<svg viewBox="0 0 ' + w + " " + (h + 20) + '" width="100%" role="img">';
  for (const f of [0.5, 1]) s += '<line x1="' + pad + '" x2="' + w + '" y1="' + (h - f * (h - 8)) + '" y2="' + (h - f * (h - 8)) + '" stroke="var(--line)" stroke-dasharray="2 3"/><text x="0" y="' + (h - f * (h - 8) + 4) + '">' + Math.round(f * max) + "</text>";
  cols.forEach((c, i) => {
    let y = h;
    const x = pad + i * bw + bw * 0.18, bwi = bw * 0.64;
    keys.forEach(k => {
      const n = c.parts[k] || 0; if (!n) return;
      const bh = n / max * (h - 8);
      y -= bh;
      s += '<rect x="' + x + '" y="' + y + '" width="' + bwi + '" height="' + Math.max(bh - 1.5, 1) + '" rx="3" fill="' + colors[k] + '"><title>' + esc(c.label) + ": " + n + " " + esc(OUT[k] ? OUT[k][0].toLowerCase() : k) + "</title></rect>";
    });
    s += '<text x="' + (x + bwi / 2) + '" y="' + (h + 15) + '" text-anchor="middle">' + esc(c.short || c.label) + "</text>";
  });
  return s + "</svg>";
}
function bars(vals, labels, color, h = 120, fmt = v => v) {
  return stacked(vals.map((v, i) => ({label: labels[i], short: labels[i], parts: {v}})), ["v"], {v: color}, h);
}

      '<div class="small muted">You said you\'re here to</div><div class="intent">' + esc(f.intent) + "</div>" +

function stat(v, k, sub) { return '<div class="card stat"><div class="v">' + esc(v) + '</div><div class="k">' + esc(k) + '</div><div class="sub">' + esc(sub || "") + "</div></div>"; }
function lastPopup() { const p = D.insights.today; return p.length ? hm(p[p.length - 1].at) : ""; }
function timeline() {
  const w = 520, h = 70, x = t => 18 + (w - 36) * t / 24;
  let s = '<svg viewBox="0 0 ' + w + " " + (h + 18) + '" width="100%" role="img"><line x1="18" x2="' + (w - 18) + '" y1="' + (h / 2) + '" y2="' + (h / 2) + '" stroke="var(--line)" stroke-width="2"/>';
  for (let t = 0; t <= 24; t += 3) s += '<line x1="' + x(t) + '" x2="' + x(t) + '" y1="' + (h / 2 - 4) + '" y2="' + (h / 2 + 4) + '" stroke="var(--line)"/><text x="' + x(t) + '" y="' + (h + 14) + '" text-anchor="middle">' + String(t).padStart(2, "0") + ":00</text>";
  const now = new Date(), nx = x(now.getHours() + now.getMinutes() / 60);
  s += '<line x1="' + nx + '" x2="' + nx + '" y1="8" y2="' + (h - 8) + '" stroke="var(--faint)" stroke-dasharray="2 3"/>';
  D.insights.today.forEach((p, i) => {
    const t = +p.at.slice(11, 13) + p.at.slice(14, 16) / 60;
    s += '<circle cx="' + x(t) + '" cy="' + (h / 2 + (i % 3 - 1) * 11) + '" r="6" fill="' + OUT[p.ended][1] + '" stroke="var(--card)" stroke-width="2"><title>' +
      hm(p.at) + " · " + esc(p.rule) + " · " + esc(p.title) + " · " + OUT[p.ended][0].toLowerCase() + "</title></circle>";
  });
  if (!D.insights.today.length) s += '<text x="' + (w / 2) + '" y="' + (h / 2 - 12) + '" text-anchor="middle">no pop-ups today</text>';
  return s + "</svg>";
}

function detailsHtml(j) {
  if (!j.p_hit) return "";

    h += "<tr><td>" + esc(rid) + '</td><td><div class="meter"><div class="f ' + (p >= t ? "over" : "") + '" style="width:' + Math.min(100, p * 100) +
      '%"></div><div class="t" style="left:' + (t * 100) + '%"></div></div></td><td class="small muted">' + p.toFixed(2) + " / needs " + esc(t) + "</td></tr>";
  });
  h += "</table>";
  const probs = o => o ? Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, v]) => esc(k) + " " + v.toFixed(2)).join(", ") : "";
  h += '<div class="small muted" style="margin-top:8px">page: ' + probs(j.page_probs) + "<br>purpose: " + probs(j.purpose_probs) +
    "<br>came from: " + (j.came_from ? esc(j.came_from.page_kind + " · " + j.came_from.key) : "—") + " · opened on purpose: " + (j.opened_on_purpose ? "yes" : "no") +
    " · " + esc(j.latency_ms) + " ms · #" + esc(j.id) + "</div>";
  h += "<pre>" + esc(JSON.stringify(j.state, null, 2)) + "</pre>";

async function answer(kind) {
  const q = queue(); const g = q[pos]; if (!g) return;
  const e = g.rep, ids = g.members.map(m => m.j.id);
  if (kind === "skip") { pos++; pick = null; render(); return; }
  if (kind === "right") {
    if (await post("/api/review", {ids:ids, verdict:"right"})) { toast("✓ saved" + (ids.length > 1 ? " for " + ids.length + " pages" : "")); pick = null; render(); }
    return;
  }
  if (kind === "wrong") { pick = new Set(flagged(e.j)); render(); return; }
  if (kind === "cancel") { pick = null; render(); return; }
  if (kind === "save") {
    const rules = {};
    D.rules.forEach(r => { rules[r.id] = pick.has(r.id) ? "yes" : "no"; });
    const popped = outcome(e.j) === "intervene";
    const verdict = popped && pick.size === 0 ? "should_not_block" : !popped && pick.size ? "should_block" : "wrong";
    if (await post("/api/review", {ids:ids, verdict:verdict, rules:rules})) { toast("✗ saved" + (ids.length > 1 ? " for " + ids.length + " pages" : "")); pick = null; render(); }
  }
}

    return '<tr data-key="' + esc(e.key) + '"><td>' + (e.shot ? '<img src="/shots/' + esc(e.shot) + '" loading="lazy" alt="">' : "") + "</td>" +
      '<td class="small muted">' + esc(e.last.slice(5, 16).replace("T", " ")) + "</td>" +
      '<td class="t"><b>' + esc(j.screen.window_title || j.screen.app) + '</b>' + (e.similar > 1 ? ' <span class="small muted">+' + (e.similar - 1) + " similar</span>" : "") + '<br><span class="small muted">' + esc(j.screen.url || j.screen.app) + "</span></td>" +
      '<td><span class="tag ' + o + '">' + ({intervene:"popped up", allow:"allowed", count:"counted", none:"nothing", skip:"not judged"})[o] + (rules ? ": " + esc(rules) : "") + "</span></td>" +
      "<td>" + you + "</td></tr>";
  }).join("") + "</table></div>";
  return h;
}

// ---- rules tab ----------------------------------------------------------
function rulesView() {
  const c = D.capacity;
  let h = '<div style="margin-bottom:18px"><h1>Rules</h1><div class="muted">Switch rules on and off, tune thresholds from your answers, and teach exceptions. Changes are checked, saved to rules.toml (the old one kept as rules.toml.bak), and picked up by the app at once.</div></div>';
  h += '<div class="card" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Your rules</h2><span class="small muted">' +
    c.now + " of " + c.limit + " questions per reading now" + (c.peak !== c.now ? " · " + c.peak + " at the busiest (" + esc(c.peak_at) + ")" : "") + "</span></div>" +
    '<div class="bar" style="margin:10px 0 6px"><div style="width:' + Math.min(100, 100 * c.peak / c.limit) + '%"></div></div>';
  D.allrules.forEach(r => {
    const t = D.tuning.find(x => x.rule === r.id);
    const sug = t && t.suggested != null && t.suggested !== t.threshold ? ' · suggested <b>' + t.suggested + "</b> (right " + Math.round(t.suggested_precision * 100) + "%, catches " + Math.round(t.suggested_recall * 100) + '%) <button data-apply="' + esc(r.id) + '" data-value="' + t.suggested + '" style="padding:2px 10px;font-size:12px">Apply</button>' : "";
    h += '<div class="rule ' + (r.enabled ? "" : "off") + '"><button class="switch ' + (r.enabled ? "on" : "") + '" data-toggle="' + esc(r.id) + '" title="' + (r.enabled ? "on: click to switch off" : "off: click to switch on") + '"></button>' +
      '<div><div class="id">' + esc(r.id) + (r.enabled && !r.active ? ' <span class="small faint">(outside its hours now)</span>' : "") + '</div><div class="sum">' + esc(r.summary) + "</div>" +
      '<div class="small faint" style="margin-top:4px">threshold ' + esc(r.threshold) + (t ? " · your answers: " + t.yes + " yes, " + t.no + " no" : "") + sug + "</div></div>" +
      '<span class="tag ' + (r.kind === "deny" ? "intervene" : "count") + '">' + (r.kind === "deny" ? "steps in" : "time cap") + "</span></div>";
  });
  h += '<div class="small faint" style="margin-top:10px">New rules, wording and hours: <code>qualm rules add</code> / <code>qualm rules set</code>, or ask Claude Code (it knows the CLI). “Edit rules…” in the menu opens the file.</div></div>';
  h += '<div class="grid g2"><div class="card"><h2>Exceptions</h2><div class="small muted" style="margin-bottom:8px">In your own words; the model reads them with the rule. E.g. for videos: “a lecture or conference talk”.</div>' +
    '<div style="display:flex;gap:8px;align-items:flex-start"><select id="excRule">' + D.rules.map(r => '<option value="' + esc(r.id) + '">' + esc(r.id) + "</option>").join("") +
    '</select><input type="text" id="excText" placeholder="…is fine" style="flex:1"><button data-act="exc">Add</button></div>';
  D.rules.forEach(r => {
    const xs = r.exceptions.concat(D.exceptions.filter(e => e.rule === r.id && e.text && !e.removed).map(e => e.text));
    if (xs.length) h += '<div class="small" style="margin-top:12px"><b>' + esc(r.id) + "</b>" + xs.map(x => '<div class="muted">· ' + esc(x) + "</div>").join("") + "</div>";
  });
  h += "</div>";
  h += '<div class="card"><h2>Never here</h2><div class="small muted" style="margin-bottom:8px">Apps and sites where no rule fires, from the pop-up’s “Never here”.</div>' +
    (D.never.length ? D.never.map((n, i) => '<div class="row" style="justify-content:space-between;margin:6px 0"><span>' + (n.host ? "on <b>" + esc(n.host) + "</b>" : "in <b>" + esc(n.name || n.app) + "</b>") +
      '</span><button data-undo="' + i + '" style="padding:3px 10px;font-size:13px">Undo</button></div>').join("") : '<div class="small muted">None yet.</div>') + "</div></div>";
  return h;
}

// ---- render and input ---------------------------------------------------
function render() {
  document.querySelectorAll(".tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
  $("#mode").textContent = D.budgets ? "" : "testing mode";
  const S = D.session;
  $("#state").innerHTML = S.focus ? '<span class="chip focus"><span class="dot"></span>Focus · ' + Math.max(1, Math.round((S.focus.until - S.now) / 60)) + " min</span>"
    : S.paused_until > S.now ? '<span class="chip paused"><span class="dot"></span>Paused until ' + clock(S.paused_until) + "</span>"
    : '<span class="chip"><span class="dot"></span>Watching</span>';
  const n = queue().length;
  $("#nleft").innerHTML = n ? '<span class="n">' + n + "</span>" : "";
  const views = {today: todayView, review: reviewView, all: allView, insights: insightsView, rules: rulesView};
  $("#view").innerHTML = (views[tab] || todayView)();
  const s = $("#search"); if (s && document.activeElement !== s && search) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}
function go(t) { tab = t; pick = null; history.replaceState(null, "", "#" + t); render(); window.scrollTo(0, 0); }
document.addEventListener("click", ev => {
  const t = ev.target;
  const a = t.closest(".tabs a"); if (a) { go(a.dataset.tab); return; }
  if (t.matches(".one img, table.list img")) { $("#zoom img").src = t.src; $("#zoom").style.display = "flex"; ev.stopPropagation(); return; }
  const b = t.closest("button, a[data-act]");
  if (!b) {
    const row = t.closest("tr[data-key]");
    if (row) { const e = screens().find(x => x.key === row.dataset.key); if (e && e.j.p_hit) reviewOne(e); }
    return;
  }
  const act = b.dataset.act;
  if (b.dataset.goto) { go(b.dataset.goto); return; }
  if (b.dataset.len) { focusLen = +b.dataset.len; document.querySelectorAll(".seg button").forEach(x => x.classList.toggle("on", x === b)); return; }
  if (act === "focus-stop") { post("/api/focus", {stop:true}).then(ok => { if (ok) { toast("focus session ended"); render(); } }); return; }
  if (act === "resume") { post("/api/pause", {minutes:0}).then(ok => { if (ok) { toast("watching again"); render(); } }); return; }
  if (act === "pause30") { ev.preventDefault(); post("/api/pause", {minutes:30}).then(ok => { if (ok) { toast("paused for 30 minutes"); render(); } }); return; }
  if (act === "exc") {
    post("/api/exception", {rule:$("#excRule").value, text:$("#excText").value}).then(ok => { if (ok) { toast("exception added"); render(); } });
    return;
  }
  if (b.dataset.toggle) {
    const r = D.allrules.find(x => x.id === b.dataset.toggle);
    post("/api/rule/enabled", {rule:r.id, on:!r.enabled}).then(ok => { if (ok) { toast(r.id + (r.enabled ? " switched off" : " switched on")); render(); } });
    return;
  }
  if (b.dataset.reflect) { post("/api/reflect", {week:D.insights.this_week, answer:b.dataset.reflect}).then(ok => { if (ok) { toast("noted, thank you"); render(); } }); return; }
  if (act) { answer(act); return; }
  if (b.dataset.pick !== undefined) {
    if (b.dataset.pick === "") pick = new Set(); else if (pick.has(b.dataset.pick)) pick.delete(b.dataset.pick); else pick.add(b.dataset.pick);
    render(); return;
  }
  if (b.dataset.apply) { post("/api/threshold", {rule:b.dataset.apply, value:b.dataset.value}).then(ok => { if (ok) { toast("rules.toml updated"); render(); } }); return; }
  if (b.dataset.lf) { listFilter = b.dataset.lf; render(); return; }
  if (b.dataset.undo !== undefined) { post("/api/never/undo", {place:D.never[+b.dataset.undo]}).then(ok => { if (ok) { toast("undone"); render(); } }); return; }
});
document.addEventListener("submit", ev => {
  if (ev.target.id !== "focusform") return;
  ev.preventDefault();
  const intent = $("#intent").value.trim();
  if (!intent) { $("#intent").focus(); return; }
  post("/api/focus", {intent:intent, minutes:focusLen}).then(ok => { if (ok) { toast("focus: " + intent); render(); } });
});
function reviewOne(e) {
  tab = "review"; pick = null; quiet = true;
  const find = qq => qq.findIndex(g => g.members.some(m => m.key === e.key));
  const i = find(queue());
  if (i >= 0) { pos = i; go("review"); return; }
  // Already reviewed: clear the verdict so it can be answered again.
  post("/api/review", {ids:[e.j.id], verdict:null}).then(() => { pos = Math.max(0, find(queue())); go("review"); });
}
document.addEventListener("change", ev => { if (ev.target.id === "quiet") { quiet = ev.target.checked; pos = 0; render(); } });
document.addEventListener("input", ev => { if (ev.target.id === "search") { search = ev.target.value.toLowerCase(); render(); } });
document.addEventListener("toggle", ev => { if (ev.target.id === "det") showDetails = ev.target.open; }, true);
$("#zoom").onclick = () => { $("#zoom").style.display = "none"; };
document.addEventListener("keydown", ev => {
  if (tab !== "review" || ev.target.matches("input, textarea, select") || ev.metaKey || ev.ctrlKey) return;
  const k = ev.key.toLowerCase();
  if (pick === null) {
    if (k === "r") answer("right");
    else if (k === "w") answer("wrong");
    else if (k === "s" || k === "arrowright") answer("skip");
    else if (k === "arrowleft") { pos = Math.max(0, pos - 1); render(); }
    else if (k === "d") { showDetails = !showDetails; render(); }
    else return;
  } else {
    if (k === "enter") answer("save");
    else if (k === "escape") answer("cancel");
    else if (k === "0") { pick = new Set(); render(); }
    else if (/^[1-9]$/.test(k) && D.rules[+k - 1]) { const id = D.rules[+k - 1].id; if (pick.has(id)) pick.delete(id); else pick.add(id); render(); }
    else return;
  }
  ev.preventDefault();
});
load();
setInterval(() => { if (pick === null && !document.querySelector("textarea:focus, input:focus, select:focus")) load(); }, 15000);
</script></body></html>
