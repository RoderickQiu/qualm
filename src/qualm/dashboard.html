<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Qualm review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffb36b'/%3E%3Cstop offset='1' stop-color='%23f0645a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='31' cy='30' r='14' fill='none' stroke='white' stroke-width='6'/%3E%3Cpath d='M40 39 L49 48' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* The page is titled "Qualm review" on purpose: the watcher never judges a window with that title. */
:root {
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1e; --mute:#6e6e73; --faint:#a1a1a6; --line:#e6e4df; --soft:#f0eee9;
  --accent:#f3814e; --accent2:#ffb36b; --accentbg:#fdeee4;
  --back:#3fae6a; --session:#35a39c; --snooze:#e9a23b; --fine:#6f86b8; --never:#a07cc5; --open:#cfccc6;
  --focus:#2f9fd8; --focusbg:#e3f3fb;
  --red:#c8372d; --redbg:#fbeae8; --amber:#9a5700; --amberbg:#fcf0dc; --blue:#1f5fbf; --bluebg:#e7effb; --green:#1e7b3c; --greenbg:#e4f3e9;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 24px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#131314; --card:#1d1d1f; --ink:#f2f2f4; --mute:#a0a0a8; --faint:#6b6b72; --line:#2d2d31; --soft:#26262a;
    --accentbg:#3a2419; --open:#48474d; --focusbg:#15303e;
    --red:#ff7a6e; --redbg:#3b1d1a; --amber:#f2b454; --amberbg:#3a2c14; --blue:#79a8ff; --bluebg:#18264a; --green:#6fd48e; --greenbg:#16301f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 30px rgba(0,0,0,.25);
  }
}
* { box-sizing:border-box; }
body { margin:0; font:15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
nav { display:flex; align-items:center; gap:6px; padding:12px 24px; position:sticky; top:0; z-index:5;
  background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:saturate(1.6) blur(18px); -webkit-backdrop-filter:saturate(1.6) blur(18px); border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:10px; margin-right:18px; font-weight:700; font-size:17px; letter-spacing:-.01em; }
.brand svg { width:28px; height:28px; }
.tabs { display:flex; gap:2px; background:var(--soft); padding:3px; border-radius:11px; }
.tabs a { padding:6px 14px; border-radius:8px; color:var(--mute); text-decoration:none; cursor:pointer; font-size:14px; font-weight:500; user-select:none; }
.tabs a.on { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
.tabs a .n { display:inline-block; min-width:18px; padding:0 5px; margin-left:4px; border-radius:9px; background:var(--accent); color:#fff; font-size:11px; font-weight:700; text-align:center; }
nav .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
.chip { display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:20px; font-size:13px; font-weight:500; background:var(--soft); color:var(--mute); }
.chip .dot { width:7px; height:7px; border-radius:50%; background:var(--back); }
.chip.focus { background:var(--focusbg); color:var(--focus); } .chip.focus .dot { background:var(--focus); }
.chip.paused, .chip.warn { background:var(--amberbg); color:var(--amber); } .chip.paused .dot, .chip.warn .dot { background:var(--snooze); }
.chip.off .dot { background:var(--faint); }
.notice { margin:0 0 16px; padding:12px 16px; border-radius:12px; background:var(--amberbg); color:var(--amber); font-size:14px; }
.wrap { max-width:1180px; margin:0 auto; padding:26px 24px 60px; }
.muted { color:var(--mute); } .faint { color:var(--faint); } .small { font-size:13px; }
kbd { font:12px ui-monospace, SFMono-Regular, monospace; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; background:var(--card); color:var(--mute); }
button { font:inherit; font-size:14px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:9px; padding:8px 14px; cursor:pointer; transition:border-color .15s, background .15s; }
button:hover { border-color:var(--faint); }
button.primary { background:var(--ink); color:var(--card); border-color:var(--ink); }
button.accent { background:linear-gradient(135deg, var(--accent2), var(--accent)); color:#fff; border:0; font-weight:600; }
button.focusbtn { background:var(--focus); color:#fff; border:0; font-weight:600; }
input[type=text], input[type=search], textarea, select { font:inherit; font-size:14px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:9px; padding:8px 10px; }
input:focus, textarea:focus, select:focus { outline:2px solid color-mix(in srgb, var(--focus) 45%, transparent); border-color:var(--focus); }
h1 { font-size:30px; letter-spacing:-.02em; margin:0 0 4px; font-weight:700; }
h2 { font-size:16px; margin:0 0 12px; font-weight:650; letter-spacing:-.005em; }
.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; box-shadow:var(--shadow); }
.grid { display:grid; gap:16px; }
.g2 { grid-template-columns:repeat(2, minmax(0,1fr)); } .g4 { grid-template-columns:repeat(4, minmax(0,1fr)); } .g3 { grid-template-columns:repeat(3, minmax(0,1fr)); }
@media (max-width:900px) { .g4 { grid-template-columns:1fr 1fr; } .g2, .g3 { grid-template-columns:1fr; } }
.stat .v { font-size:34px; font-weight:700; letter-spacing:-.02em; line-height:1.1; font-variant-numeric:tabular-nums; }
.stat .k { font-size:13px; color:var(--mute); margin-top:4px; }
.stat .sub { font-size:12px; color:var(--faint); margin-top:2px; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--mute); margin-top:10px; }
.legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
svg text { fill:var(--mute); font-size:11px; font-family:inherit; }
.bar { height:10px; border-radius:6px; background:var(--soft); overflow:hidden; }
.bar > div { height:100%; border-radius:6px; background:linear-gradient(90deg, var(--accent2), var(--accent)); }
.row { display:flex; align-items:center; gap:12px; }
.hero { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:16px; margin-bottom:16px; }
@media (max-width:900px) { .hero { grid-template-columns:1fr; } }
.session h2 { display:flex; align-items:center; gap:8px; }
.session .intent { font-size:22px; font-weight:650; letter-spacing:-.01em; margin:2px 0 6px; }
.session form { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.session form input { flex:1; min-width:180px; }
.seg { display:inline-flex; background:var(--soft); border-radius:9px; padding:2px; }
.seg button { border:0; background:transparent; padding:6px 10px; border-radius:7px; color:var(--mute); }
.seg button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12); }
.empty { text-align:center; padding:46px 20px; color:var(--mute); }
.empty .big { font-size:40px; margin-bottom:6px; }
.empty a, .notice a { color:inherit; } a[data-act], a[data-goto] { cursor:pointer; text-decoration:underline; }
.list-plain > div { padding:9px 0; border-top:1px solid var(--line); } .list-plain > div:first-child { border-top:0; }
.quote { font-size:15px; } .quote::before { content:"“"; color:var(--faint); } .quote::after { content:"”"; color:var(--faint); }

/* review: one screen at a time */
.progress { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.progress .track { flex:1; height:6px; background:var(--soft); border-radius:3px; overflow:hidden; }
.progress .fill { height:100%; background:var(--back); }
.one { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:24px; }
@media (max-width:700px) { .one { grid-template-columns:1fr; } }
.before { margin:14px 0 -6px; font-size:14px; color:var(--mute); }
.one img { width:100%; border-radius:12px; border:1px solid var(--line); display:block; cursor:zoom-in; }
.noshot { aspect-ratio:16/10; border-radius:12px; background:var(--soft); display:flex; align-items:center; justify-content:center; color:var(--mute); }
.title { font-size:19px; font-weight:650; overflow-wrap:anywhere; letter-spacing:-.01em; }
.url { color:var(--mute); font-size:13px; overflow-wrap:anywhere; margin-top:2px; }
.said { margin:16px 0; padding:12px 14px; border-radius:12px; font-size:15px; }
.said.intervene { background:var(--accentbg); color:var(--accent); }
.said.allow { background:var(--amberbg); color:var(--amber); }
.said.count { background:var(--bluebg); color:var(--blue); }
.said.none { background:var(--soft); color:var(--mute); }
.said .why { display:block; font-size:13px; opacity:.85; margin-top:3px; }
.q { font-weight:650; margin:18px 0 8px; }
.choices { display:flex; gap:8px; flex-wrap:wrap; }
.choices button { font-size:15px; padding:10px 16px; }
.choices .right.sel { background:var(--greenbg); border-color:var(--green); color:var(--green); }
.choices .wrong.sel { background:var(--redbg); border-color:var(--red); color:var(--red); }
.chips { display:flex; flex-direction:column; gap:6px; margin-top:6px; }
.pick { display:flex; align-items:center; gap:10px; text-align:left; padding:8px 12px; border-radius:10px; }
.pick.sel { background:var(--redbg); border-color:var(--red); }
.pick.none.sel { background:var(--greenbg); border-color:var(--green); }
.pick .name { font-weight:600; } .pick .desc { font-size:12px; color:var(--mute); }
.pick kbd { flex:none; }
.save { margin-top:12px; display:flex; gap:8px; align-items:center; }
details { margin-top:18px; } summary { cursor:pointer; color:var(--mute); font-size:13px; }
.scores { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
.scores td { padding:3px 4px; }
.meter { position:relative; height:7px; background:var(--soft); border-radius:4px; width:130px; }
.meter .f { position:absolute; left:0; top:0; bottom:0; border-radius:4px; background:var(--faint); }
.meter .f.over { background:var(--accent); }
.meter .t { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); }
pre { background:var(--soft); border-radius:8px; padding:8px; white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; max-height:220px; overflow:auto; }
.keys { margin-top:14px; font-size:12px; color:var(--mute); }
.similar { margin:-6px 0 6px; } .similar summary { color:var(--ink); font-size:14px; }

/* all screens */
.opts { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
.opts input[type=search] { min-width:260px; }
.opts button.on { background:var(--ink); color:var(--card); border-color:var(--ink); }
.scroll { overflow-x:auto; }
table.list { width:100%; border-collapse:collapse; font-size:14px; }
table.list td.when { white-space:nowrap; }
table.list td { padding:8px 10px; border-top:1px solid var(--line); vertical-align:middle; }
table.list tr { cursor:pointer; } table.list tr:hover td { background:var(--soft); }
table.list img { width:68px; height:42px; object-fit:cover; border-radius:6px; display:block; }
table.list .t { max-width:480px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
@media (max-width:900px) { table.list .t { max-width:220px; } table.list .tag { white-space:normal; } }
.more { display:flex; gap:14px; align-items:center; justify-content:center; padding:12px 0 4px; font-size:13px; color:var(--mute); }
.more a { color:var(--mute); cursor:pointer; }
.tag { display:inline-block; border-radius:6px; padding:1px 8px; font-size:12px; font-weight:600; white-space:nowrap; }
.tag.intervene { background:var(--accentbg); color:var(--accent); } .tag.allow { background:var(--amberbg); color:var(--amber); }
.tag.count { background:var(--bluebg); color:var(--blue); } .tag.none, .tag.skip { background:var(--soft); color:var(--mute); }
.tag.right { background:var(--greenbg); color:var(--green); } .tag.wrong { background:var(--redbg); color:var(--red); }

/* rules */
.rule { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:14px; align-items:start; padding:14px 0; border-top:1px solid var(--line); }
.rule:first-of-type { border-top:0; }
.rule .id { font-weight:650; overflow-wrap:anywhere; } .rule .sum { color:var(--mute); font-size:14px; margin-top:2px; overflow-wrap:anywhere; }
.rule details { margin-top:4px; } .rule details pre { margin:6px 0 0; }
.rid { font:12px ui-monospace, SFMono-Regular, monospace; color:var(--faint); font-weight:400; margin-left:6px; }
#excRule { max-width:40%; text-overflow:ellipsis; }
.x { border:0; background:none; padding:0 6px; color:var(--faint); font-size:15px; line-height:1; }
.x:hover { color:var(--red); }
.rule.off .id, .rule.off .sum, .rule.off details { opacity:.5; }
.switch { position:relative; width:42px; height:25px; border-radius:13px; background:var(--open); border:0; padding:0; cursor:pointer; transition:background .2s; flex:none; margin-top:2px; }
.switch::after { content:""; position:absolute; top:3px; left:3px; width:19px; height:19px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .2s; }
.switch.on { background:var(--back); } .switch.on::after { left:20px; }
table.tune { width:100%; border-collapse:collapse; font-size:14px; }
table.tune td, table.tune th { padding:8px; border-top:1px solid var(--line); text-align:left; vertical-align:top; }
table.tune th { font-size:12px; color:var(--mute); font-weight:500; border-top:0; }
#zoom { position:fixed; inset:0; background:rgba(0,0,0,.82); display:none; align-items:center; justify-content:center; z-index:10; cursor:zoom-out; }
#zoom img { max-width:94vw; max-height:94vh; border-radius:10px; }
.toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--card); padding:9px 16px; border-radius:10px; font-size:13px; display:none; z-index:20; box-shadow:var(--shadow); max-width:min(640px, 92vw); }
.toast.error { background:#c8372d; color:#fff; cursor:pointer; }
.heat td { width:calc(100% / 25); height:18px; border-radius:3px; }
.heat { border-collapse:separate; border-spacing:2px; width:100%; table-layout:fixed; }
.heat th { font-size:10px; color:var(--faint); font-weight:500; }
</style></head><body>
<nav>
  <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb36b"/><stop offset="1" stop-color="#f0645a"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><circle cx="31" cy="30" r="14" fill="none" stroke="white" stroke-width="6"/><path d="M40 39 L49 48" stroke="white" stroke-width="6" stroke-linecap="round"/></svg>Qualm</div>
  <div class="tabs">
    <a data-tab="today">Today</a>
    <a data-tab="review">Review<span id="nleft"></span></a>
    <a data-tab="all">All screens</a>
    <a data-tab="insights">Insights</a>
    <a data-tab="rules">Rules</a>
  </div>
  <div class="right"><span id="state"></span></div>
</nav>
<div class="wrap" id="view"></div>
<div id="zoom"><img alt=""></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
let D = null, V = "", seq = 0;  // the data on the page, its version (the server answers "same" while it holds), the latest request
let tab = location.hash.slice(1) || "today", pos = 0, quiet = false, search = "", listFilter = "all", older = false;
let qn = 20, rn = 100;  // review cards and All screens rows to ask for; more as you go
let pinned = null;    // a screen opened from All screens: its card, before the queue
let pick = null;      // while answering "wrong": the set of rule ids the page really is
let showDetails = false, focusLen = 50;
const openPatterns = new Set();  // rules whose address patterns you opened, kept open across refreshes
const PAGE_VERSION = "__PAGE_VERSION__";  // filled in by the server: sent back with each request, so a tab from before an update knows
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// A qualm command as this Mac's terminal runs it (agent.command(): plain `qualm` only when it's on PATH), and the same in the server's own messages.
const cmd = s => "<code>" + esc(D.command + " " + s) + "</code>";
const ours = t => String(t).replace(/`qualm /g, "`" + D.command + " ");
const OUT = {back:["Went back","var(--back)"], session:["Checked in","var(--session)"], snooze:["Unlocked","var(--snooze)"], fine:["Not this one","var(--fine)"], never:["Never here","var(--never)"], open:["No answer","var(--open)"]};
const WRITES = "Qualm writes here as you use your Mac. Keep it running (it lives in the menu bar) and browse as usual.";  // day 0
function toast(t, error) {
  const el = $("#toast"); el.textContent = t; el.className = "toast" + (error ? " error" : ""); el.style.display = "block";
  // A confirmation goes quickly; an error stays long enough to read, or until clicked.
  clearTimeout(el.tm); el.tm = setTimeout(() => { el.style.display = "none"; }, error ? Math.max(6000, 70 * t.length) : 1800);
}

async function load(force) {
  const n = ++seq;
  const qs = new URLSearchParams({v: force ? "" : V, quiet: quiet ? 1 : 0, qn: qn, rn: rn, q: search, f: listFilter, older: older ? 1 : 0, page: PAGE_VERSION});
  let res, r;
  try { res = await fetch("/api/data?" + qs); r = res.status === 404 ? null : await res.json(); } catch (err) { if (n === seq) gone(); return; }
  if (n !== seq || r && r.same) return;
  if (r && r.reload) { updated(r.error); return; }
  if (r && r.error) { $("#view").innerHTML = '<div class="card empty"><div class="big">!</div><h2>Can\'t read Qualm\'s data</h2><div class="muted">' + esc(r.error) + "</div></div>"; return; }
  if (!r || !r.queue) {  // a Qualm started before this page changed: its server doesn't know what the page asks
    $("#view").innerHTML = '<div class="card empty"><div class="big">↻</div><h2>Qualm was updated</h2><div class="muted">Quit it from the menu bar (Quit Qualm) and open it again to see this page.</div></div>';
    return;
  }
  D = r; V = r.v; render();
}
function gone() { $("#state").innerHTML = chipHtml(["off", "Not running", "The dashboard can't reach Qualm: open it again, then reload this page."]); }
// Qualm was updated since this tab opened: load its page, once; if that didn't help, say so.
function updated(msg) {
  const last = +sessionStorage.getItem("qualm-reloaded") || 0;
  if (Date.now() - last > 60000) { sessionStorage.setItem("qualm-reloaded", Date.now()); location.reload(); return; }
  $("#view").innerHTML = '<div class="card empty"><div class="big">↻</div><h2>Qualm was updated</h2><div class="muted">' + esc(msg) + "</div></div>";
}
// Changes go to the server; then the page asks for what it shows again.
async function post(path, body, done) {
  let r;
  try { r = await (await fetch(path, {method:"POST", headers:{"Content-Type":"application/json", "X-Qualm-Page":PAGE_VERSION}, body:JSON.stringify(body)})).json(); }
  catch (err) { gone(); toast("Qualm isn't running: open it, then try again.", true); return false; }
  if (r.error) { toast(r.error, true); return false; }  // from a tab older than Qualm: "reload this page", nothing changed
  if (done) done();
  await load(true);
  return true;
}

// ---- words for what the log says ------------------------------------------
function rule(id) { return D.rules.find(r => r.id === id); }
function name(id) { const r = rule(id); return r ? r.name : id; }  // a removed rule keeps its id
function ruleName(r) {
  const t = r.text || "";
  const cut = t.split(/,? such as |[,:;，：；(（]/)[0];
  return cut.length > 60 ? cut.slice(0, 57) + "…" : cut;
}
const pct = p => Math.round(p * 100) + "%";
const PAGE = {feed:"a feed", single_item:"a single page", search:"a search", work:"a work tool", other:"another page"};
const WORDS = {"matches URL pattern": "the address is one of this rule's sites", "an entertainment feed": "it's a feed of recommendations, for entertainment",
  "opened on purpose": "you opened it on purpose", "work tool": "it looked like a work tool", "learning material": "it looked like learning material",
  "search results": "it looked like search results: what you open from them is judged",
  "sensitive page": "it looked private (a sign-in, bank or mail page), so Qualm didn't read it", "app not monitored": "this app is never watched",
  "paused": "Qualm was paused", "allowed URL": "the address is on your allow list", "Qualm's own page": "it's Qualm's own page"};
// The policy's reasons in words: "p_hit 0.45 >= 0.30" -> "it scored 45%; this rule steps in at 30%".
function plain(reason) {
  let m;
  if ((m = /^p_hit ([\d.]+) >= ([\d.]+)$/.exec(reason || ""))) return "it scored " + pct(+m[1]) + "; this rule steps in at " + pct(+m[2]);
  if (/^too little on screen to judge/.test(reason)) return "there was too little on screen to judge";
  if ((m = /^left within (.+)$/.exec(reason || ""))) return "you left within " + m[1] + ", before it was due";
  return WORDS[reason] || reason || "";
}
function said(j) {
  const o = j.outcome;
  const ds = j.decisions.filter(d => d.action === o);
  const names = ds.map(d => "<b>" + esc(name(d.rule)) + "</b>").join(", ");
  const why = [...new Set(ds.map(d => plain(d.reason)).filter(Boolean))].map(esc).join("; ");
  if (o === "intervene") {  // the app shows the first hit's pop-up

    return {cls:"none", text:"Not judged", why:why};

function pickRules(j) { const f = flagged(j); return D.rules.filter(r => r.enabled || f.has(r.id)); }
// When a pause or session ends, as the menu bar and `qualm pause` say it: "22:34" today, "Mon 09:00" in the next six days, "Oct 5 09:00" after.
function clock(t) {
  const d = new Date(t * 1000), n = new Date(), hm = d.toTimeString().slice(0, 5);

  return days === 0 ? hm : days > 0 && days < 7 ? d.toLocaleDateString(undefined, {weekday:"short"}) + " " + hm

const day = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
// "22:34" today, "yesterday 22:34", else "Sep 21, 22:34".

// ---- small SVG charts ----------------------------------------------------
// Stacked bars: cols = [{label, parts:{key:n}}], keys in stacking order.
function stacked(cols, keys, colors, h = 150) {
  const w = 540, pad = 22, bw = (w - pad) / cols.length;
  const most = Math.max(0, ...cols.map(c => keys.reduce((n, k) => n + (c.parts[k] || 0), 0)));
  const max = most > 1 ? 2 * Math.ceil(most / 2) : 1;  // an even top, so the middle line is a whole number too
  let s = '<svg viewBox="0 0 ' + w + " " + (h + 20) + '" width="100%" role="img">';
  for (const f of [0.5, 1]) s += '<line x1="' + pad + '" x2="' + w + '" y1="' + (h - f * (h - 8)) + '" y2="' + (h - f * (h - 8)) + '" stroke="var(--line)" stroke-dasharray="2 3"/>' +
    (Number.isInteger(f * max) ? '<text x="0" y="' + (h - f * (h - 8) + 4) + '">' + f * max + "</text>" : "");
  cols.forEach((c, i) => {
    let y = h;
    const x = pad + i * bw + bw * 0.18, bwi = bw * 0.64;
    keys.forEach(k => {
      const n = c.parts[k] || 0; if (!n) return;
      const bh = n / max * (h - 8);
      y -= bh;
      s += '<rect x="' + x + '" y="' + y + '" width="' + bwi + '" height="' + Math.max(bh - 1.5, 1) + '" rx="3" fill="' + colors[k] + '"><title>' + esc(c.label) + ": " + n + " " + esc(OUT[k] ? OUT[k][0].toLowerCase() : k) + "</title></rect>";
    });
    s += '<text x="' + (x + bwi / 2) + '" y="' + (h + 15) + '" text-anchor="middle">' + esc(c.short || c.label) + "</text>";
  });
  return s + "</svg>";
}
function bars(vals, labels, color, h = 120) {
  return stacked(vals.map((v, i) => ({label: labels[i], short: labels[i], parts: {v}})), ["v"], {v: color}, h);
}

// ---- what keeps Qualm from watching ----------------------------------------
function modelDown() { const m = D.status.model; return m && m !== "ok" && m !== "starting"; }
// The hosted model's trouble as the menu bar tells it (app.TROUBLE): the chip, the menu's words, why, and what to do.
const TROUBLE = {
  nokey: ["No key saved", "No TypeSafe key is saved", "The hosted model needs one, so new screens aren't judged", "Add a TypeSafe key"],
  key: ["Key doesn't work", "Your TypeSafe key doesn't work", "TypeSafe turned it down, so new screens aren't judged", "Add a key that works"],
  quota: ["Usage limit reached", "TypeSafe's usage limit is reached", "Until it resets, new screens aren't judged", "Add a key with room left"],
  down: ["TypeSafe not answering", "TypeSafe isn't answering", "Until it does, new screens aren't judged", "Check your internet connection"],

function chip() {
  const S = D.session, A = D.status, T = TROUBLE[A.trouble];

  if (S.paused_until > S.now) return ["paused", "Paused until " + clock(S.paused_until), "Nothing is judged until then."];
  if (A.accessibility === false) return ["warn", "Needs Accessibility", "Qualm can only see app names."];
  if (T) return ["warn", T[0], T[1]];

  if (D.problem) return ["warn", "Can't read your rules", ours(D.problem)];  // on hosted, nothing is asked meanwhile: not "Starting…"
  if (A.model === "starting") return ["", "Starting…", "Waiting for the model's first answer."];
  if (!D.rules.some(r => r.enabled && r.active)) return ["off", "No rules on now", "Qualm won't step in anywhere right now."];

}
function chipHtml(c) { return '<span class="chip ' + c[0] + '" title="' + esc(c[2]) + '"><span class="dot"></span>' + esc(c[1]) + "</span>"; }
function notice() {
  const A = D.status, S = D.session;
  let t = "";
  if (!A.running) t = "<b>Qualm isn't running</b>, so nothing is being watched. Open Qualm (it lives in the menu bar), or run " + cmd("app") + " in a terminal.";
  else if (S.paused_until > S.now) t = "";
  else if (A.accessibility === false) t = "<b>Qualm can only see app names.</b> Turn Qualm on in System Settings › Privacy &amp; Security › Accessibility; Qualm picks it up by itself, without a restart.";
  else if (TROUBLE[A.trouble]) {  // in the menu's words, with its fixes (app.Controller._set_trouble)
    const T = TROUBLE[A.trouble], menu = "Qualm's menu in the menu bar (Model)";
    t = "<b>" + T[1] + ".</b> " + T[2] + "; a rule's own sites still step in. " + (A.trouble === "down"
      ? T[3] + (A.local ? ", or use the model on this Mac from " + menu + "." : ".")
      : T[3] + " from " + menu + (A.local ? ", or use the model on this Mac from the same menu." : "."));
  }
  else if (modelDown()) t = "<b>The model" + (D.backend === "kev" ? " on this Mac" : "") + " isn't answering</b>, so new screens aren't judged; a rule's own sites still step in." +
    (D.backend === "kev" ? " It takes a minute or two to start (longer the first time), and Qualm restarts it if it stops; Qualm's menu in the menu bar says what it's doing." : "");
  else if (!D.problem && !D.rules.some(r => r.enabled)) t = "<b>Every rule is off</b>, so Qualm won't step in anywhere. Switch one on in <a href=\"#rules\" data-goto=\"rules\">Rules</a>.";

// The error names the file and, mostly, `qualm config undo` already: said once, with what else there is to do,
// and what the app judges with meanwhile, as the app itself says (status.json; an app that doesn't say keeps what it had).
function problem() {

  // The error advises `config undo` only when it has a version to go back to (config.undo_to), as D.undo says.

    esc(p).replace(/`([^`]+)`/g, "<code>$1</code>") + "<br>Until it's fixed, " + uses + ". This page can't change your rules until then. " +

function detailsHtml(j) {

async function answer(kind) {
  const g = current(); if (!g) return;
  const done = t => () => { toast(t + (g.ids.length > 1 ? " for " + g.ids.length + " pages" : "")); pick = null; pinned = null; };
  if (kind === "skip") { if (pinned) pinned = null; else pos++; pick = null; render(); more(); return; }
  if (kind === "right") { await post("/api/review", {ids:g.ids, verdict:"right"}, done("✓ saved")); return; }
  if (kind === "wrong") { pick = new Set(flagged(g.j)); render(); return; }
  if (kind === "cancel") { pick = null; render(); return; }
  if (kind === "save") {
    const rules = {};
    pickRules(g.j).forEach(r => { rules[r.id] = pick.has(r.id) ? "yes" : "no"; });
    const popped = g.j.outcome === "intervene";
    const verdict = popped && pick.size === 0 ? "should_not_block" : !popped && pick.size ? "should_block" : "wrong";
    await post("/api/review", {ids:g.ids, verdict:verdict, rules:rules}, done("✗ saved"));
  }
}

    else if (k === "escape") answer("cancel");
    else if (k === "0") { pick = new Set(); render(); }
    else if (/^[1-9]$/.test(k) && rs[+k - 1]) { const id = rs[+k - 1].id; if (pick.has(id)) pick.delete(id); else pick.add(id); render(); }
    else return;
  }
  ev.preventDefault();
});
load();
// Refresh (the server says "same" while nothing changed), but never over something you're typing or choosing.
const busy = () => pick !== null || document.querySelector("textarea:focus, input:focus, select:focus") ||
  [...document.querySelectorAll("#intent, #excText")].some(el => el.value.trim());
setInterval(() => { if (!busy()) load(); }, 15000);
</script></body></html>
